[workspace]
members = [
    "bin",
    "crates/app",
    "crates/train",
]

resolver = "3"

[workspace.dependencies]
rustp2p = { version = "0.4.1" }
iced = { version = "0.14.0"}
tokio = { version = "1.54.1", features = ["full"] }

app = { package = "app", path = "crates/app" }
train = { package = "train", path = "crates/train" }
